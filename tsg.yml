templatePath: src/templates
staticPath: build
buildPath: build

context:
  site: data/site.graphql
  assets: ../../build/assets/manifest.json

images: &images
  default:
    # w: 500
    # h: 500
  small:
    w: 333
    h: 333
  medium:
    w: 666
    h: 666
  large:
    w: 999
    h: 999

routes:
  sitemap:
    path: /sitemap.xml
    template: feeds/sitemap.xml
    context: data/sitemap.graphql

  searchData:
    path: /search.json
    template: feeds/search.json
    context: data/search.graphql

  storyTitles:
    path: /story-titles.json
    template: feeds/story-titles.json
    context: data/story-titles.graphql

  search:
    path: /search/
    template: pages/search.html

  homepage:
    path: /
    template: pages/homepage.html
    context: data/homepage.graphql

  film:
    path: /film
    template: pages/film.html
    context: data/film.graphql

  still:
    path: /still
    template: pages/still.html
    context: data/still.graphql

  story:
    path: /story/:title
    template: pages/stories/detail.html
    context: data/story.graphql
    paginate:
      pageSize: 12
      firstPage: /blog/
      path: /blog/page-:num
      template: pages/stories/landing.html
      data: data/stories.graphql
      itemName: page

  storySlug:
    path: /story/:slug
    template: pages/stories/detail.html
    context: data/story.graphql
    paginate:
      data: data/story-slugs.graphql
      itemName: page

  destinations:
    path: /destinations
    template: pages/destinations.html
    context: data/destinations.graphql

  destinationHubMockup:
    path: /destination-hub-mockup/
    template: pages/destination-hub-mockup.html

  about:
    path: /about
    template: pages/about.html
    context: data/about.graphql

  ads:
    path: /ads.txt
    template: pages/ads.txt
    context: data/ads.graphql

  privacy:
    path: /privacy/
    template: pages/privacy.html
    context: data/privacy.graphql

  filmCategory:
    path: /film/:title
    template: pages/film-category.html
    context: data/film-category.graphql
    paginate:
      data: data/film-categories.graphql
      itemName: page

  stillCategory:
    path: /still/:title
    template: pages/still-category.html
    context: data/still-category.graphql
    paginate:
      data: data/still-categories.graphql
      itemName: page

  category:
    path: /category/:title
    template: pages/category.html
    context: data/category.graphql
    paginate:
      data:
        query: data/categories.graphql
        variables:
          where:
            _id:
              in: ["72e3d920-3bfc-4329-aa12-f5333173752b", "72d10adf-51dd-4c2f-bf6c-f6dbdc6d14e1", "272af0cf-ef31-451b-a570-6f2434700fdb", "5e637310-8209-404b-9b22-0061282a6bc5", "8df2e9cd-9144-4493-9257-0bb8811941b0", "b334dc54-a972-42d7-8011-30fefc05e635", "3d8b535b-d722-4e06-a43a-69384aa81ebe", "c74f43a5-a70d-4fbf-9867-4931eaf050ec", "cf3e39d5-ef51-461c-bed1-abf92de772b1", "05094f08-be26-4d22-9869-c67aff57261a"]
      itemName: page

  subcategory:
    path: /category/:parentCategory.title/:title
    template: pages/category.html
    context: data/category.graphql
    paginate:
      data:
        query: data/categories.graphql
        variables:
          where:
            NOT:
              _id:
                in: ["75008b77-af8a-4623-a3f0-b692fa87fb0e", "72e3d920-3bfc-4329-aa12-f5333173752b", "72d10adf-51dd-4c2f-bf6c-f6dbdc6d14e1", "272af0cf-ef31-451b-a570-6f2434700fdb", "5e637310-8209-404b-9b22-0061282a6bc5", "8df2e9cd-9144-4493-9257-0bb8811941b0", "b334dc54-a972-42d7-8011-30fefc05e635", "3d8b535b-d722-4e06-a43a-69384aa81ebe", "c74f43a5-a70d-4fbf-9867-4931eaf050ec", "cf3e39d5-ef51-461c-bed1-abf92de772b1", "05094f08-be26-4d22-9869-c67aff57261a"]
      itemName: page

  categoryArchive:
    path: /category/:title/archive
    template: pages/category-archive.html
    context: data/category.graphql
    paginate:
      data:
        query: data/categories.graphql
        variables:
          where:
            _id:
              in: ["72e3d920-3bfc-4329-aa12-f5333173752b", "72d10adf-51dd-4c2f-bf6c-f6dbdc6d14e1", "272af0cf-ef31-451b-a570-6f2434700fdb", "5e637310-8209-404b-9b22-0061282a6bc5", "8df2e9cd-9144-4493-9257-0bb8811941b0", "b334dc54-a972-42d7-8011-30fefc05e635", "3d8b535b-d722-4e06-a43a-69384aa81ebe", "c74f43a5-a70d-4fbf-9867-4931eaf050ec", "cf3e39d5-ef51-461c-bed1-abf92de772b1", "05094f08-be26-4d22-9869-c67aff57261a"]
      itemName: page

  subcategoryArchive:
    path: /category/:parentCategory.title/:title/archive
    template: pages/category-archive.html
    context: data/category.graphql
    paginate:
      data:
        query: data/categories.graphql
        variables:
          where:
            NOT:
              _id:
                in: ["75008b77-af8a-4623-a3f0-b692fa87fb0e", "72e3d920-3bfc-4329-aa12-f5333173752b", "72d10adf-51dd-4c2f-bf6c-f6dbdc6d14e1", "272af0cf-ef31-451b-a570-6f2434700fdb", "5e637310-8209-404b-9b22-0061282a6bc5", "8df2e9cd-9144-4493-9257-0bb8811941b0", "b334dc54-a972-42d7-8011-30fefc05e635", "3d8b535b-d722-4e06-a43a-69384aa81ebe", "c74f43a5-a70d-4fbf-9867-4931eaf050ec", "cf3e39d5-ef51-461c-bed1-abf92de772b1", "05094f08-be26-4d22-9869-c67aff57261a"]
      itemName: page

  legacyHealthAndFitness:
    path: /category/health-and-fitness
    template: pages/legacy-category.html

  legacyShopping:
    path: /category/shopping
    template: pages/legacy-category.html

  legacyBestBeaches:
    path: /category/best-beaches
    template: pages/legacy-category.html

  legacyTravelTips:
    path: /category/travel-tips
    template: pages/legacy-category.html

  legacySocialMediaAndTechnology:
    path: /category/social-media-and-technology
    template: pages/legacy-category.html

  legacyFilms:
    path: /category/films
    template: pages/legacy-category.html

  legacyStyle:
    path: /category/style
    template: pages/legacy-category.html

  legacyTravelAdventures:
    path: /category/travel-adventures
    template: pages/legacy-category.html

  legacyLosAngelesLife:
    path: /category/los-angeles-life
    template: pages/legacy-category.html

  legacyInstagramGuides:
    path: /category/instagram-guides
    template: pages/legacy-category.html

  legacyHotelsAndResorts:
    path: /category/hotels-and-resorts
    template: pages/legacy-category.html

  legacyWeddingVenueSixTips:
    path: /story/how-to-choose-the-perfect-wedding-venue-6-essential-planning-tips
    template: pages/legacy-story.html

  location:
    path: /destinations/:title
    template: pages/location.html
    context: data/location.graphql
    paginate:
      data: data/locations.graphql
      itemName: page

  locationArchive:
    path: /destinations/:title/archive
    template: pages/location-archive.html
    context: data/location.graphql
    paginate:
      data: data/locations.graphql
      itemName: page

  continent:
    path: /continent/:name
    template: pages/location.html
    context: data/continent.graphql
    paginate:
      data: data/continents.graphql
      itemName: page

  continentArchive:
    path: /continent/:name/archive
    template: pages/location-archive.html
    context: data/continent.graphql
    paginate:
      data: data/continents.graphql
      itemName: page

deploy:
  - ${buildPath}
