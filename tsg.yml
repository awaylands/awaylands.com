templatePath: src/templates
staticPath: static
buildPath: build

context:
  site: data/site.graphql
  assets: ../../static/assets/manifest.json
  favicon: ../../static/assets/favicon-mainfest.json
  isStaging: ${env.IS_STAGING}

images: &images
  default:
    # w: 500
    # h: 500
  small:
    w: 333
    h: 333
  medium:
    w: 666
    h: 666
  large:
    w: 999
    h: 999

routes:
  sitemap:
    path: /sitemap.xml
    template: feeds/sitemap.xml
    context: data/sitemap.graphql

  searchData:
    path: /search.json
    template: feeds/search.json
    context: data/search.graphql

  storyTitles:
    path: /story-titles.json
    template: feeds/story-titles.json
    context: data/story-titles.graphql

  search:
    path: /search/
    template: pages/search.html

  homepage:
    path: /
    template: pages/homepage.html
    context: data/homepage.graphql

  film:
    path: /film
    template: pages/film.html
    context: data/film.graphql

  still:
    path: /still
    template: pages/still.html
    context: data/still.graphql

  story:
    path: /story/:title
    template: pages/stories/detail.html
    context: data/story.graphql
    paginate:
      pageSize: 32
      firstPage: /blog/
      path: /blog/page-:num
      template: pages/stories/landing.html
      data: data/stories.graphql
      itemName: page

  storySlug:
    path: /story/:slug
    template: pages/stories/detail.html
    context: data/story.graphql
    paginate:
      data: data/story-slugs.graphql
      itemName: page

  destinations:
    path: /destinations
    template: pages/destinations.html
    context: data/destinations.graphql

  destinationHubMockup:
    path: /destination-hub-mockup/
    template: pages/destination-hub-mockup.html

  about:
    path: /about
    template: pages/about.html
    context: data/about.graphql

  ads:
    path: /ads.txt
    template: pages/ads.txt
    context: data/ads.graphql

  privacy:
    path: /privacy/
    template: pages/privacy.html
    context: data/privacy.graphql

  filmCategory:
    path: /film/:title
    template: pages/film-category.html
    context: data/film-category.graphql
    paginate:
      data: data/film-categories.graphql
      itemName: page

  stillCategory:
    path: /still/:title
    template: pages/still-category.html
    context: data/still-category.graphql
    paginate:
      data: data/still-categories.graphql
      itemName: page

  category:
    path: /category/:title
    template: pages/category.html
    context: data/category.graphql
    paginate:
      data: data/categories.graphql
      itemName: page

  legacyHealthAndFitness:
    path: /category/health-and-fitness
    template: pages/legacy-category.html

  legacyShopping:
    path: /category/shopping
    template: pages/legacy-category.html

  legacyBestBeaches:
    path: /category/best-beaches
    template: pages/legacy-category.html

  legacyTravelTips:
    path: /category/travel-tips
    template: pages/legacy-category.html

  legacySocialMediaAndTechnology:
    path: /category/social-media-and-technology
    template: pages/legacy-category.html

  legacyFilms:
    path: /category/films
    template: pages/legacy-category.html

  legacyStyle:
    path: /category/style
    template: pages/legacy-category.html

  legacyTravelAdventures:
    path: /category/travel-adventures
    template: pages/legacy-category.html

  legacyLosAngelesLife:
    path: /category/los-angeles-life
    template: pages/legacy-category.html

  legacyInstagramGuides:
    path: /category/instagram-guides
    template: pages/legacy-category.html

  legacyHotelsAndResorts:
    path: /category/hotels-and-resorts
    template: pages/legacy-category.html

  location:
    path: /destinations/:title
    template: pages/location.html
    context: data/location.graphql
    paginate:
      data: data/locations.graphql
      itemName: page

  continent:
    path: /continent/:name
    template: pages/continent.html
    context: data/continent.graphql
    paginate:
      data: data/continents.graphql
      itemName: page

deploy:
  - ${buildPath}/static
