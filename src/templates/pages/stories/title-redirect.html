{% set destination = (page | route('storySlug')) if page.slug else (page | route('story')) %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="awaylands-generated-story-redirect" content="true">
  <meta http-equiv="refresh" content="0; url={{ destination }}">
  <link rel="canonical" href="https://www.awaylands.com{{ destination }}">
  <title>Story moved | Away Lands</title>
  <script>window.location.replace({{ destination | dump | safe }} + window.location.search + window.location.hash);</script>
</head>
<body><p>This story has moved. <a href="{{ destination }}">Continue to the story</a>.</p></body>
</html>
