query($images: TSImagesConfig) {
  getStoryList(onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      _enabledAt
      _updatedAt
      title
      slug
      isImportant
      postType
      pageLayout
      atAGlance {
        kicker
        title
        summary
        item1Section
        item1Title
        item1Link
        item2Section
        item2Title
        item2Link
        item3Section
        item3Title
        item3Link
      }
      shopEditTitle
      shopEditEnabled
      shopEditItems {
        image {
          path
        }
        title
        productUrl
        productEmbedHtml
      }
      firstHandExpertise {
        kicker
        title
        text
      }
      keepReadingKicker
      keepReadingTitle
      mainCategoryLabels: mainCategory { title }
      mainCategory {
        title
        storySet(size: 12, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
          items {
            _contentTypeName
            _status
            _enabledAt
            _updatedAt
            isImportant
            title
            slug
            category { title }
            social { title }
            tout { image { path } }
          }
        }
      }
      categoryLabels: category {
        title
        parentCategory { title }
      }
      category {
        title
        parentCategory { title }
        storySet(size: 12, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
          items {
            _contentTypeName
            _status
            _enabledAt
            _updatedAt
            isImportant
            title
            slug
            category { title }
            social {
              title
            }
            tout {
              image {
                path
              }
            }
          }
        }
      }
      location {
        title
        storySet(size: 12, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
          items {
            _contentTypeName
            _status
            _enabledAt
            _updatedAt
            isImportant
            title
            slug
            category { title }
            social {
              title
            }
            tout {
              image {
                path
              }
            }
          }
        }
      }
      continent {
        name
        storySet(size: 12, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
          items {
            _contentTypeName
            _status
            _enabledAt
            _updatedAt
            isImportant
            title
            slug
            category { title }
            social { title }
            tout { image { path } }
          }
        }
      }
      contentHtml(images: $images, headerIdPrefix: "story-main-")
      extraContentBlocks {
        contentHtml(images: $images, headerIdPrefix: "story-extra-")
      }
      extraHtmlBlocks {
        html
      }
      extraTableBlocks {
        pastedText
        columnCount
      }
      mainHtmlBlock1
      mainContentBlock1Html(images: $images, headerIdPrefix: "story-main-1-")
      additionalMainBlocks {
        mainHtmlBlock2
        mainContentBlock2Html(images: $images, headerIdPrefix: "story-grouped-2-")
        mainHtmlBlock3
        mainContentBlock3Html(images: $images, headerIdPrefix: "story-grouped-3-")
        mainHtmlBlock4
        mainContentBlock4Html(images: $images, headerIdPrefix: "story-grouped-4-")
        mainHtmlBlock5
        mainContentBlock5Html(images: $images, headerIdPrefix: "story-grouped-5-")
        mainHtmlBlock6
        mainContentBlock6Html(images: $images, headerIdPrefix: "story-grouped-6-")
      }
      mainHtmlBlock2
      mainContentBlock2Html(images: $images, headerIdPrefix: "story-legacy-2-")
      mainHtmlBlock3
      mainContentBlock3Html(images: $images, headerIdPrefix: "story-legacy-3-")
      mainHtmlBlock4
      mainContentBlock4Html(images: $images, headerIdPrefix: "story-legacy-4-")
      mainHtmlBlock5
      mainContentBlock5Html(images: $images, headerIdPrefix: "story-legacy-5-")
      mainHtmlBlock6
      mainContentBlock6Html(images: $images, headerIdPrefix: "story-legacy-6-")
      contentBlocks {
        __typename
        ... on ContentBlock {
          contentHtml(images: $images, headerIdPrefix: "story-structured-")
        }
        ... on HtmlBlock {
          html
        }
        ... on TableBlock {
          pastedText
          columnCount
        }
        ... on StoryImageBlock {
          image { path }
          size
          alignment
          cropPosition
          spacing
          linkUrl
          linkTarget
          caption
          altText
          label
        }
        ... on StoryGalleryBlock {
          layout
          size
          label
          images {
            image { path }
            linkUrl
            caption
            altText
          }
        }
      }
      relatedStories {
        _status
        _enabledAt
        _updatedAt
        isImportant
        title
        slug
        category {
          title
        }
        social {
          title
        }
        tout {
          image {
            path
          }
        }
      }
      tout {
        image {
          path
        }
        caption
        secondaryImage {
          path
        }
        dek
      }
      social {
        title
        description
        image {
          path
        }
      }
    }
    total
  }
}
