query {
  products: getProducts {
    travel { image { path } title description productUrl  addToHomepage }
    style { image { path } title description productUrl  addToHomepage }
    photography { image { path } title description productUrl  addToHomepage }
    beauty { image { path } title description productUrl  addToHomepage }
  }
  categories: getBlog {
    categories {
      title
      parentCategory { title }
    }
  }
  featuredCategories: getCategoryList {
    items {
      title
      storySet(size: 6, onlyEnabled: true) {
        items {
          _contentTypeName
          title
          slug
          category { title parentCategory { title } }
          tout {
            image {
              path
            }
            dek
          }
        }
      }
    }
  }
  archiveStories1: getStoryList(size: 250, from: 0, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      title
      slug
      category { title parentCategory { title } }
      tout { image { path } dek }
    }
  }
  archiveStories2: getStoryList(size: 250, from: 250, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      title
      slug
      category { title parentCategory { title } }
      tout { image { path } dek }
    }
  }
  archiveStories3: getStoryList(size: 250, from: 500, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      title
      slug
      category { title parentCategory { title } }
      tout { image { path } dek }
    }
  }
  archiveStories4: getStoryList(size: 250, from: 750, onlyEnabled: true, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      title
      slug
      category { title parentCategory { title } }
      tout { image { path } dek }
    }
  }
  page: getBlog {
    _contentTypeName
    title
    featuredStory {
      _contentTypeName
      _enabledAt
      title
      slug
      category { title parentCategory { title } }
      tout {
        image {
          path
        }
        dek
      }
      shopEditItems {
        image { path }
        title
        productUrl
        productEmbedHtml
      }
    }
    heroImageOverride { path }
    heroImageFocus
    supportingStories {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    editorsPicks {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    travelEssentialsBackgroundImage { path }
    travelEssentialsBackgroundFocus
    travelEssentialsLabel
    travelEssentialsTitle
    travelEssentialsLinkText
    travelEssentialsLinkUrl
    travelEssentialsItems { image { path } title description productUrl productEmbedHtml }
    categoryTile1Category { title parentCategory { title } }
    categoryTile1Image { path }
    categoryTile1Focus
    categoryTile2Category { title parentCategory { title } }
    categoryTile2Image { path }
    categoryTile2Focus
    categoryTile3Category { title parentCategory { title } }
    categoryTile3Image { path }
    categoryTile3Focus
    categoryTile4Category { title parentCategory { title } }
    categoryTile4Image { path }
    categoryTile4Focus
    categoryTile5Category { title parentCategory { title } }
    categoryTile5Image { path }
    categoryTile5Focus
    categoryTile6Category { title parentCategory { title } }
    categoryTile6Image { path }
    categoryTile6Focus
    categoryTile7Category { title parentCategory { title } }
    categoryTile7Image { path }
    categoryTile7Focus
    categoryTile8Category { title parentCategory { title } }
    categoryTile8Image { path }
    categoryTile8Focus
    revolveSectionTitle
    revolveSectionLinkUrl
    revolveSectionEmbedHtml
    featuredItineraries {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    leftFullBleedStory {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    leftFullBleedImageOverride { path }
    leftFullBleedImageFocus
    leftFullBleedMobileImageOverride { path }
    leftFullBleedMobileImageFocus
    rightFullBleedStory {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    rightFullBleedImageOverride { path }
    rightFullBleedImageFocus
    rightFullBleedMobileImageOverride { path }
    rightFullBleedMobileImageFocus
    latestStories {
      _contentTypeName title slug category { title parentCategory { title } }
      tout { image { path } dek }
    }
    categories {
      title
    }
    social {
      title
      description
      image {
        path
      }
    }
  }

}
