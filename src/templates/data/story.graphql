query {
  categories: getBlog {
    categories {
      title
    }
  }
  featuredCategories: getCategoryList {
    items {
      title
      storySet(size: 6) {
        items {
          _contentTypeName
          _enabledAt
          title
          slug
          social {
            title
          }
          category {
            title
          }
          location {
            title
          }
          tout {
            image {
              path
            }
            dek
          }
        }
      }
    }
  }
  featuredCategoryCandidates: getCategoryList {
    items {
      title
      storySet(size: 12, sort: [{field: "_enabledAt", order: "desc"}]) {
        items {
          _contentTypeName
          _enabledAt
          title
          slug
          category { title }
          tout {
            image { path }
            dek
          }
        }
      }
    }
  }
  recentStories: getStoryList(size: 8, sort: [{field: "_enabledAt", order: "desc"}]) {
    items {
      _contentTypeName
      title
      slug
      social { title }
      tout { image { path } }
    }
  }
  page: getBlog {
    _contentTypeName
    title
    featuredStory {
      _contentTypeName
      _enabledAt
      title
      slug
      category {
        title
      }
      tout {
        image {
          path
        }
        dek
      }
    }
    categories {
      title
    }
    social {
      title
      description
      image {
        path
      }
    }
  }

}
