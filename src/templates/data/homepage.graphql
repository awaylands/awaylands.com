query {
  products: getProducts {
    travel { image { path } title description productUrl productEmbedHtml addToHomepage }
    style { image { path } title description productUrl productEmbedHtml addToHomepage }
    photography { image { path } title description productUrl productEmbedHtml addToHomepage }
    beauty { image { path } title description productUrl productEmbedHtml addToHomepage }
    fitness { image { path } title description productUrl productEmbedHtml addToHomepage }
    home { image { path } title description productUrl productEmbedHtml addToHomepage }
  }
  page: getHomepage {
    _contentTypeName
    slider {
      interval
      slides {
        image {
          path
        }
        caption {
          text
          url
        }
      }
    }
    social {
      title
      description
      image {
        path
      }
    }
  }

  blog: getBlog {
    _contentTypeName
    title
    featuredStory {
      _contentTypeName
      _enabledAt
      title
      slug
      category {
        title
      }
      tout {
        image {
          path
        }
        dek
      }
      shopEditItems { image { path } title productUrl productEmbedHtml }
    }
    heroImageOverride { path }
    heroImageFocus
    supportingStories { _contentTypeName title slug category { title } tout { image { path } dek } }
    editorsPicks { _contentTypeName title slug category { title } tout { image { path } dek } }
    shoppingStory { _contentTypeName title slug shopEditItems { image { path } title productUrl productEmbedHtml } }
    travelEssentialsBackgroundImage { path }
    travelEssentialsBackgroundFocus
    travelEssentialsLabel
    travelEssentialsTitle
    travelEssentialsLinkText
    travelEssentialsLinkUrl
    travelEssentialsItems { image { path } title description productUrl productEmbedHtml }
    categoryFeatureStories { _contentTypeName title slug category { title } tout { image { path } dek } }
    categoryTile1Category { title }
    categoryTile1Image { path }
    categoryTile1Focus
    categoryTile2Category { title }
    categoryTile2Image { path }
    categoryTile2Focus
    categoryTile3Category { title }
    categoryTile3Image { path }
    categoryTile3Focus
    categoryTile4Category { title }
    categoryTile4Image { path }
    categoryTile4Focus
    categoryTile5Category { title }
    categoryTile5Image { path }
    categoryTile5Focus
    categoryTile6Category { title }
    categoryTile6Image { path }
    categoryTile6Focus
    categoryTile7Category { title }
    categoryTile7Image { path }
    categoryTile7Focus
    categoryTile8Category { title }
    categoryTile8Image { path }
    categoryTile8Focus
    categoryTile9Category { title }
    categoryTile9Image { path }
    categoryTile9Focus
    categoryTile10Category { title }
    categoryTile10Image { path }
    categoryTile10Focus
    revolveSectionTitle
    revolveSectionLinkUrl
    revolveSectionEmbedHtml
    featuredItineraries { _contentTypeName title slug category { title } tout { image { path } dek } }
    leftFullBleedStory { _contentTypeName title slug category { title } tout { image { path } dek } }
    leftFullBleedImageOverride { path }
    leftFullBleedImageFocus
    leftFullBleedMobileImageOverride { path }
    leftFullBleedMobileImageFocus
    rightFullBleedStory { _contentTypeName title slug category { title } tout { image { path } dek } }
    rightFullBleedImageOverride { path }
    rightFullBleedImageFocus
    rightFullBleedMobileImageOverride { path }
    rightFullBleedMobileImageFocus
    latestStories { _contentTypeName title slug category { title } tout { image { path } dek } }
  }

  recentStories: getStoryList(size: 8, sort: [{field: "_enabledAt", order: "desc"}]) {
    items { _contentTypeName _enabledAt title slug social { title } category { title } tout { image { path } } }
  }

  shoppingStories: getStoryList(
    size: 8,
    where: {shopEditItems: {productUrl: {regexp: ".+"}}},
    sort: [{field: "_enabledAt", order: "desc"}]
  ) {
    items { _contentTypeName title slug shopEditItems { image { path } title productUrl productEmbedHtml } }
  }

  featuredCategories: getCategoryList {
    items {
      title
      storySet(size: 12, sort: [{field: "_enabledAt", order: "desc"}]) {
        items {
          _contentTypeName
          _enabledAt
          title
          slug
          category {
            title
          }
          tout {
            image {
              path
            }
            dek
          }
        }
      }
    }
  }

  stories: getStoryList {
    items {
      _enabledAt
      title
      slug
      tout {
        image {
          path
        }
        dek
      }
      category {
        title
      }
    }
  }
}
