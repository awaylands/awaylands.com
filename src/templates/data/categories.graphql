query {
  blog: getBlog {
    categories { title }
  }
  getCategoryList {
    items {
      _contentTypeName
      title
      introText
      featuredStories {
        _id
        _enabledAt
        isImportant
        title
        slug
        tout {
          image { path }
          secondaryImage { path }
          dek
        }
      }
      storySet(size: 250) {
        items {
          _id
          _enabledAt
          isImportant
          title
          slug
          tout {
            image {
              path
            }
            secondaryImage {
              path
            }
            dek
          }
          category {
            title
          }
        }
      }
      social {
        title
        description
        image {
          path
        }
      }
    }
    total
  }
}
